# Runs the live tests against ecfr.gov every day, so changes to the API or its
# data are caught before users hit them: every model is checked against every
# title, and rendering is checked to be lossless on a corpus of large parts.
name: Live API contract

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - run: uv run --frozen pytest -m network

      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Live eCFR API contract check failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$TITLE" --body "The nightly live tests failed: $RUN_URL"
          else
            echo "An issue is already open."
          fi
