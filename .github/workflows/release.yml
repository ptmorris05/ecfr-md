# Publishes a GitHub Release when a version tag (v1.2.3) is pushed: the tag
# must match the version in pyproject.toml, the full CI suite must pass, and
# the wheel and source distribution are attached with build provenance.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          }

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ecfr-md ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag "${flags[@]}"
