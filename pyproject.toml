[project]
name = "cfr-md"
version = "0.1.0"
description = "Download Code of Federal Regulations text from the eCFR API as Markdown."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=5.2.0",
    "httpx2>=2.13.1",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[project.scripts]
cfr-md = "cfr_md.cli:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not network", "--strict-markers"]
markers = ["network: calls the live eCFR API (run with: pytest -m network)"]
