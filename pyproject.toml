[project]
name = "ecfr-md"
version = "0.2.0rc1"
description = "Code of Federal Regulations text from the eCFR API as navigable Python objects and Markdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["cfr", "ecfr", "regulations", "federal register", "markdown", "law"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=5.2.0",
    "dateparser>=1.4.3",
    "httpx2[http2]>=2.13.1",
    "markdown-it-py>=4.3.0",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
]

[project.urls]
Homepage = "https://github.com/ptmorris05/ecfr-md"
Documentation = "https://ptmorris05.github.io/ecfr-md/"
Repository = "https://github.com/ptmorris05/ecfr-md"
Issues = "https://github.com/ptmorris05/ecfr-md/issues"
Changelog = "https://github.com/ptmorris05/ecfr-md/blob/main/CHANGELOG.md"

[project.scripts]
ecfr-md = "ecfr_md.cli:main"

[project.optional-dependencies]
docx = [
    "python-docx>=1.2.0",
]
pdf = [
    "typst>=0.15.2",
]
tui = [
    "textual>=8.2.8",
]
all = [
    "ecfr-md[docx,mcp,pdf,tui,web]",
]
mcp = [
    "fastmcp>=4.2.2",
]
web = [
    "jinja2>=3.1.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[tool.uv.build-backend]
# Also ship the changelog, the license and the tests, which distribution
# packagers run against the source distribution.
source-include = ["CHANGELOG.md", "LICENSE*", "tests/**"]

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastmcp>=4.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pypdf>=7.1.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "ruff>=0.17.0",
    "starlette>=1.10.0",
    "textual>=8.2.8",
    "typst>=0.15.2",
    "uvicorn>=0.54.0",
]

docs = [
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not network", "--strict-markers"]
markers = ["network: calls the live eCFR API (run with: pytest -m network)"]

[tool.ruff.lint.isort]
known-first-party = ["ecfr_md"]

[tool.pyright]
include = ["src", "tests/typing"]
pythonVersion = "3.12"

[tool.coverage.report]
# Abstract members have no body to run.
exclude_also = ["@abstractmethod"]
